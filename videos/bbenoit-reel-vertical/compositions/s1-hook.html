<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Geist";
          font-style: normal;
          font-weight: 100 900;
          src: url("assets/fonts/Geist-Variable.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #0f172b;
          font-family: "Geist", sans-serif;
        }
        #s1-block {
          position: absolute;
          left: 72px;
          top: 410px;
          width: 936px;
        }
        #s1-eyebrow {
          display: block;
          font-size: 30px;
          font-weight: 600;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #155dfc;
          margin-bottom: 34px;
        }
        .s1-line {
          display: block;
          font-size: 118px;
          font-weight: 600;
          line-height: 0.98;
          letter-spacing: -0.045em;
          white-space: nowrap;
        }
        .s1-w {
          display: inline-block;
          will-change: transform, filter;
        }
        #s1-approx {
          position: relative;
          display: inline-block;
        }
        .s1-ch {
          display: inline-block;
          will-change: transform;
        }
        #s1-strike {
          position: absolute;
          left: -6px;
          right: -6px;
          top: 54%;
          height: 12px;
          border-radius: 6px;
          background: #155dfc;
          transform-origin: 0 50%;
        }
        #s1-sub {
          display: block;
          margin-top: 52px;
          width: 900px;
          font-size: 42px;
          line-height: 1.35;
          font-weight: 400;
          color: rgba(15, 23, 43, 0.72);
        }
      </style>

      <div id="root" data-composition-id="s1-hook" data-width="1080" data-height="1350">
        <div id="s1-block">
          <span id="s1-eyebrow">Sites · Apps · Automatisations</span>
          <span class="s1-line"><span class="s1-w" data-layout-allow-overlap>Votre</span> <span class="s1-w" data-layout-allow-overlap>activité</span></span>
          <span class="s1-line"><span class="s1-w" data-layout-allow-overlap>mérite</span> <span class="s1-w" data-layout-allow-overlap>mieux</span> <span class="s1-w" data-layout-allow-overlap>que</span></span>
          <span class="s1-line"
            ><span id="s1-approx" data-layout-allow-overlap
              ><span class="s1-ch" data-layout-allow-overlap>l</span><span class="s1-ch" data-layout-allow-overlap>’</span><span class="s1-ch" data-layout-allow-overlap>à</span><span class="s1-ch" data-layout-allow-overlap>-</span
              ><span class="s1-ch" data-layout-allow-overlap>p</span><span class="s1-ch" data-layout-allow-overlap>e</span><span class="s1-ch" data-layout-allow-overlap>u</span><span class="s1-ch" data-layout-allow-overlap>-</span
              ><span class="s1-ch" data-layout-allow-overlap>p</span><span class="s1-ch" data-layout-allow-overlap>r</span><span class="s1-ch" data-layout-allow-overlap>è</span><span class="s1-ch" data-layout-allow-overlap>s</span
              ><span id="s1-strike"></span></span
            ><span class="s1-w" data-layout-allow-overlap>.</span></span
          >
          <span id="s1-sub">Des outils web clairs, fiables et pensés pour faire avancer votre activité.</span>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s1-hook"]');
          const chars = Array.from(root.querySelectorAll(".s1-ch"));
          const SNAP = 3.0; // beat 7 — the clean chord in the soundtrack
          const hash = (i, s) => {
            const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const base = chars.map((_, i) => ({
            y: (hash(i, 1) - 0.5) * 80,
            r: (hash(i, 2) - 0.5) * 28,
            s: 0.86 + hash(i, 3) * 0.3,
          }));
          const snapEase = gsap.parseEase("back.out(2.4)");

          const tl = gsap.timeline({ paused: true });
          const EASE = "expo.out";

          // the site's word reveal: rise + unblur, staggered
          tl.fromTo("#s1-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: EASE }, 0.15);
          tl.fromTo(
            ".s1-w",
            { opacity: 0, y: 36, scale: 0.98, filter: "blur(10px)" },
            { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: EASE, stagger: 0.09 },
            0.25,
          );

          // "l'à-peu-près": arrives crooked and keeps floating… until it snaps true
          const st = { t: 0 };
          tl.fromTo(
            st,
            { t: 0 },
            {
              t: 4,
              duration: 4,
              ease: "none",
              onUpdate: () => {
                const t = st.t;
                let amp = 1;
                if (t >= SNAP) amp = 1 - snapEase(Math.min(1, (t - SNAP) / 0.32));
                chars.forEach((el, i) => {
                  const b = base[i];
                  const inK = Math.min(1, Math.max(0, (t - 0.95 - i * 0.04) / 0.35));
                  const wob = Math.sin(t * 5.2 + i * 1.3);
                  const y = (b.y + wob * 10) * amp + (1 - inK) * 60;
                  const r = (b.r + wob * 5) * amp;
                  const s = 1 + (b.s - 1) * amp;
                  el.style.transform = `translateY(${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(3)})`;
                  el.style.opacity = String(inK * (t < SNAP ? 0.5 : 0.5 + 0.5 * Math.min(1, (t - SNAP) / 0.12)));
                });
              },
            },
            0,
          );
          // then the approximation is crossed out, in brand blue
          tl.fromTo("#s1-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.42, ease: "expo.inOut" }, SNAP + 0.18);
          tl.fromTo("#s1-sub", { opacity: 0, y: 20, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: EASE }, 1.6);

          // hand-off: the site's frame cross-fade (up + blur)
          tl.to("#s1-block", { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.42, ease: "power2.in" }, 3.58);

          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
