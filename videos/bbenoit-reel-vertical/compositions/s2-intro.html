<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Geist";
          font-style: normal;
          font-weight: 100 900;
          src: url("assets/fonts/Geist-Variable.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          color: #0f172b;
          font-family: "Geist", sans-serif;
        }
        #s2-portrait-wrap {
          position: absolute;
          left: 320px;
          top: 170px;
          width: 440px;
          height: 440px;
        }
        #s2-portrait {
          display: block;
          width: 440px;
          height: 440px;
          overflow: hidden;
          border-radius: 42% 58% 53% 47% / 48% 44% 56% 52%;
          box-shadow: 0 36px 90px rgba(15, 23, 43, 0.16);
          border: 6px solid #ffffff;
        }
        #s2-portrait img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #s2-badge {
          position: absolute;
          left: 250px;
          top: 372px;
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 14px 24px;
          border-radius: 999px;
          background: #ffffff;
          box-shadow: 0 18px 44px rgba(15, 23, 43, 0.12);
          font-size: 26px;
          font-weight: 600;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          white-space: nowrap;
        }
        #s2-dot {
          display: block;
          width: 12px;
          height: 12px;
          border-radius: 50%;
          background: #00a06e;
        }
        .s2-col {
          position: absolute;
          left: 72px;
          top: 690px;
          width: 936px;
        }
        .s2-eyebrow {
          display: block;
          font-size: 30px;
          font-weight: 600;
          letter-spacing: 0.14em;
          text-transform: uppercase;
          color: #155dfc;
          margin-bottom: 28px;
        }
        .s2-h {
          display: block;
          font-size: 108px;
          font-weight: 600;
          line-height: 0.98;
          letter-spacing: -0.045em;
        }
        .s2-w {
          display: inline-block;
        }
        #s2-lyon {
          position: relative;
          display: inline-block;
          color: #155dfc;
        }
        #s2-underline {
          position: absolute;
          left: 0;
          right: 0.1em;
          bottom: 0.02em;
          height: 0.1em;
          border-radius: 0.05em;
          background: rgba(21, 93, 252, 0.28);
          transform-origin: 0 50%;
        }
        .s2-sub {
          display: block;
          margin-top: 34px;
          font-size: 40px;
          line-height: 1.32;
          color: rgba(15, 23, 43, 0.72);
        }
        #s2-years {
          display: flex;
          align-items: flex-start;
          font-size: 210px;
          font-weight: 600;
          line-height: 0.85;
          letter-spacing: -0.06em;
          color: #155dfc;
          font-variant-numeric: tabular-nums;
        }
        #s2-plus {
          font-size: 120px;
          line-height: 1;
          margin-left: 8px;
        }
        #s2-years-txt {
          display: block;
          margin-top: 24px;
          font-size: 70px;
          font-weight: 600;
          line-height: 1.02;
          letter-spacing: -0.04em;
        }
      </style>

      <div id="root" data-composition-id="s2-intro" data-width="1080" data-height="1350">
        <div id="s2-portrait-wrap">
          <div id="s2-portrait"><img src="assets/img/portrait.jpg" alt="Portrait de Benoit Bruynbroeck" /></div>
          <div id="s2-badge"><span id="s2-dot"></span>Lyon · France</div>
        </div>

        <div class="s2-col" id="s2-a">
          <span class="s2-eyebrow">Benoit Bruynbroeck</span>
          <span class="s2-h"><span class="s2-w" data-layout-allow-overlap>Développeur</span> <span class="s2-w" data-layout-allow-overlap>web</span></span>
          <span class="s2-h"
            ><span class="s2-w" data-layout-allow-overlap>freelance</span> <span class="s2-w" data-layout-allow-overlap>à</span>
            <span class="s2-w" id="s2-lyon" data-layout-allow-overlap>Lyon.<span id="s2-underline"></span></span
          ></span>
          <span class="s2-sub" id="s2-role">Développeur full stack JavaScript &amp; Tech Lead</span>
        </div>

        <div class="s2-col" id="s2-b" style="top: 670px">
          <div id="s2-years"><span id="s2-num">10</span><span id="s2-plus">+</span></div>
          <span id="s2-years-txt">ans à transformer des idées en produits utiles.</span>
          <span class="s2-sub" id="s2-goal">Avec un objectif clair : générer des clients, des revenus ou du temps gagné.</span>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s2-intro"]');
          const EASE = "expo.out";
          const tl = gsap.timeline({ paused: true });

          // portrait: blob mask blooms in, the shape keeps breathing
          tl.fromTo("#s2-portrait", { scale: 0.86, opacity: 0, filter: "blur(10px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.8, ease: EASE }, 0.05);
          tl.fromTo(
            "#s2-portrait",
            { borderRadius: "42% 58% 53% 47% / 48% 44% 56% 52%" },
            { borderRadius: "55% 45% 48% 52% / 43% 57% 45% 55%", duration: 3.8, ease: "sine.inOut", immediateRender: false },
            0.05,
          );
          tl.fromTo("#s2-portrait img", { scale: 1.12 }, { scale: 1, duration: 3.9, ease: "power2.out" }, 0);
          tl.fromTo("#s2-badge", { opacity: 0, y: 20, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.5);

          // frame A — who
          tl.fromTo("#s2-a .s2-eyebrow", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE }, 0.2);
          tl.fromTo(
            "#s2-a .s2-w",
            { opacity: 0, y: 30, scale: 0.98, filter: "blur(10px)" },
            { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.65, ease: EASE, stagger: 0.07 },
            0.28,
          );
          tl.fromTo("#s2-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "expo.inOut" }, 0.9);
          tl.fromTo("#s2-role", { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: EASE }, 0.85);
          tl.to("#s2-a", { opacity: 0, y: -36, filter: "blur(8px)", duration: 0.42, ease: "power2.in" }, 1.8);

          // frame B — proof of experience (the only number the site claims)
          const num = root.querySelector("#s2-num");
          const c = { v: 0 };
          tl.fromTo("#s2-years", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: EASE }, 2.05);
          tl.fromTo(c, { v: 0 }, { v: 10, duration: 0.8, ease: "power3.out", onUpdate: () => (num.textContent = String(Math.round(c.v))) }, 2.05);
          tl.fromTo("#s2-plus", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(3)" }, 2.75);
          tl.fromTo("#s2-years-txt", { opacity: 0, y: 26, filter: "blur(8px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: EASE }, 2.25);
          tl.fromTo("#s2-goal", { opacity: 0, y: 16, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: EASE }, 2.55);

          // hand-off to the offers
          tl.to("#s2-b", { opacity: 0, y: -36, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 3.6);
          tl.to("#s2-portrait-wrap", { opacity: 0, scale: 0.92, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, 3.6);

          window.__timelines["s2-intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
