            <div id="v4-prompt"><span id="v4-typed"></span><div id="v4-send">↑</div></div>
            <div id="v4-answer">
              <span class="v4-line" style="width: 92%"></span>
              <span class="v4-line" style="width: 84%"></span>
              <span class="v4-line" style="width: 88%"></span>
              <span class="v4-line" style="width: 56%; margin-bottom: 0"></span>
            </div>
            <div id="v4-chips"><span class="v4-chip">Cas d’usage concrets</span><span class="v4-chip">Bonnes pratiques &amp; limites</span></div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="s3-offers"]');
          const EASE = "expo.out";
          const W = 2; // one bar per offer
          const COLORS = ["#155dfc", "#00a06e", "#8457d8", "#d58e00"];
          const tl = gsap.timeline({ paused: true });

          // counter text is a pure function of time
          const count = root.querySelector("#s3-count");
          const clk = { t: 0 };
          let lastK = -1;
          tl.fromTo(
            clk,
            { t: 0 },
            {
              t: 8,
              duration: 8,
              ease: "none",
              onUpdate: () => {
                const k = Math.min(3, Math.floor(clk.t / W + 1e-6));
                if (k !== lastK) {
                  lastK = k;
                  count.textContent = `0${k + 1} / 04`;
                }
              },
            },
            0,
          );

          tl.fromTo("#s3-eyebrow, #s3-steps", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: EASE, stagger: 0.06 }, 0.02);
          tl.fromTo("#s3-card", { opacity: 0, y: 60, scale: 0.94, filter: "blur(10px)" }, { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.7, ease: EASE }, 0.02);
          tl.set(".s3-step-fill", { scaleX: 0 }, 0);

          for (let k = 0; k < 4; k++) {
            const t0 = k * W;
            const o = "#o" + (k + 1);
            const v = "#v" + (k + 1);
            // left column: the site's rise + unblur, element by element
            tl.fromTo(
              [o + " .s3-icon", o + " .s3-title", o + " .s3-pitch", o + " .s3-b"],
              { opacity: 0, y: 28, filter: "blur(8px)" },
              { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: EASE, stagger: 0.06 },
              t0 + 0.08,
            );
            tl.fromTo(o + " .s3-icon", { rotation: -20, scale: 0.7 }, { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.2)", immediateRender: false }, t0 + 0.08);
            tl.fromTo(root.querySelectorAll(".s3-step-fill")[k], { scaleX: 0 }, { scaleX: 1, duration: W - 0.1, ease: "none", immediateRender: false }, t0);
            tl.to("#s3-card-bar", { backgroundColor: COLORS[k], duration: 0.3, ease: "none" }, t0);
            // card content: the site's project-screen swap (clip inset + rise)
            tl.fromTo(
              v,
              { opacity: 0, clipPath: "inset(9% 9% 9% 9% round 24px)", y: 24, scale: 0.96 },
              { opacity: 1, clipPath: "inset(0% 0% 0% 0% round 0px)", y: 0, scale: 1, duration: 0.6, ease: EASE, immediateRender: false },
              t0 + 0.02,
            );
            if (k < 3) {
              tl.to([o], { opacity: 0, y: -30, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, t0 + W - 0.28);
              tl.to(v, { opacity: 0, duration: 0.25, ease: "power1.in" }, t0 + W - 0.22);
            }
          }
          tl.set(".s3-vis", { opacity: 0 }, 0);
          tl.set(".s3-offer", { opacity: 1 }, 0);

          // ── V1: page assembles, cursor clicks, a lead arrives (tick 9.15 / bell 9.35 in the track)
          tl.fromTo("#v1 .v1-blk, #v1-btn, #v1-img", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE, stagger: 0.035 }, 0.2);
          tl.fromTo("#v1-cursor", { x: 760, y: 620, opacity: 0 }, { x: 180, y: 470, opacity: 1, duration: 0.55, ease: "power3.inOut" }, 0.55);
          tl.fromTo("#v1-btn", { scale: 1 }, { scale: 0.94, duration: 0.07, ease: "power2.out", immediateRender: false }, 1.15);
          tl.to("#v1-btn", { scale: 1, duration: 0.35, ease: "back.out(3)" }, 1.22);
          tl.fromTo("#v1-cursor", { scale: 1 }, { scale: 0.85, duration: 0.07, immediateRender: false }, 1.15);
          tl.to("#v1-cursor", { scale: 1, duration: 0.25 }, 1.22);
          tl.fromTo("#v1-toast", { opacity: 0, y: 40, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(2)" }, 1.35);

          // ── V2: rows and tasks stack in, a task is ticked, progress fills
          tl.fromTo("#v2 .v2-row", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: EASE, stagger: 0.05 }, W + 0.2);
          tl.fromTo("#v2-phone", { y: 80, rotation: 4 }, { y: 0, rotation: 0, duration: 0.7, ease: EASE }, W + 0.05);
          tl.fromTo("#v2 .v2-task", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE, stagger: 0.07 }, W + 0.35);
          ["#v2-box-0", "#v2-box-1"].forEach((b, i) => {
            tl.to(b, { backgroundColor: "#00a06e", duration: 0.12, ease: "none" }, W + 0.95 + i * 0.3);
          });
          tl.fromTo("#v2-prog-fill", { scaleX: 0.08 }, { scaleX: 0.5, duration: 0.8, ease: "power3.out" }, W + 0.95);

          // ── V3: wires draw, a pulse runs the flow, every node checks, status goes live (bell 13.55)
          const wires = Array.from(root.querySelectorAll(".v3-wire"));
          const WL = [140, 300, 122];
          wires.forEach((w, i) => w.setAttribute("stroke-dasharray", WL[i]));
          tl.fromTo("#v3 .v3-node", { opacity: 0, scale: 0.85, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)", stagger: 0.08 }, 2 * W + 0.15);
          wires.forEach((w, i) => {
            tl.fromTo(w, { attr: { "stroke-dashoffset": WL[i] } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.3, ease: "power2.inOut" }, 2 * W + 0.45 + i * 0.12);
          });
          // pulse path through node centres (authored coordinates)
          const PATH = [
            [150, 196],
            [510, 196],
            [510, 320],
            [380, 380],
            [380, 446],
            [722, 446],
          ];
          const pulse = root.querySelector("#v3-pulse");
          const pz = { k: 0 };
          tl.fromTo(
            pz,
            { k: 0 },
            {
              k: 1,
              duration: 0.9,
              ease: "power1.inOut",
              onUpdate: () => {
                const f = pz.k * (PATH.length - 1);
                const i = Math.min(PATH.length - 2, Math.floor(f));
                const u = f - i;
                const x = PATH[i][0] + (PATH[i + 1][0] - PATH[i][0]) * u;
                const y = PATH[i][1] + (PATH[i + 1][1] - PATH[i][1]) * u;
                pulse.style.transform = `translate(${x}px, ${y}px)`;
                pulse.style.opacity = pz.k <= 0 || pz.k >= 1 ? "0" : "1";
              },
            },
            2 * W + 0.75,
          );
          [0, 1, 2, 3].forEach((i) => {
            const at = 2 * W + 0.78 + i * 0.26;
            tl.fromTo(`#v3-n${i} .v3-tick`, { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(3)" }, at);
            tl.fromTo(`#v3-n${i}`, { borderColor: "rgba(132, 87, 216, 0.28)" }, { borderColor: "rgba(132, 87, 216, 1)", duration: 0.15, immediateRender: false }, at);
          });
          tl.fromTo("#v3-status", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE }, 2 * W + 1.55);

          // ── V4: prompt types, send, answer writes itself, chips pop (bell 15.6)
          const PROMPT = "Rédige une réponse claire et chaleureuse à ce client…";
          const typed = root.querySelector("#v4-typed");
          const ty = { n: 0 };
          tl.fromTo(
            ty,
            { n: 0 },
            {
              n: PROMPT.length,
              duration: 0.75,
              ease: "none",
              onUpdate: () => {
                const n = Math.round(ty.n);
                typed.textContent = PROMPT.slice(0, n) + (n < PROMPT.length ? "|" : "");
              },
            },
            3 * W + 0.15,
          );
          tl.fromTo("#v4-send", { scale: 1 }, { scale: 0.85, duration: 0.07, immediateRender: false }, 3 * W + 0.95);
          tl.to("#v4-send", { scale: 1, duration: 0.3, ease: "back.out(3)" }, 3 * W + 1.03);
          tl.fromTo("#v4-answer", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: EASE }, 3 * W + 1.05);
          tl.fromTo("#v4 .v4-line", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out", stagger: 0.09 }, 3 * W + 1.12);
          tl.fromTo("#v4 .v4-chip", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.4)", stagger: 0.08 }, 3 * W + 1.55);

          // scene exit
          tl.to("#s3-left, #s3-card", { opacity: 0, y: -40, filter: "blur(8px)", duration: 0.35, ease: "power2.in", stagger: 0.04 }, 8 - 0.36);

          window.__timelines["s3-offers"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
