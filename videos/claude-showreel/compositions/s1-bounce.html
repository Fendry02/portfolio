<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Instrument Serif";
          font-style: italic;
          font-weight: 400;
          src: url("assets/fonts/InstrumentSerif-Italic.woff2") format("woff2");
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0e0c0a;
          color: #f3eee5;
        }
        #s1-glow {
          position: absolute;
          left: 760px;
          top: 380px;
          width: 1000px;
          height: 700px;
          border-radius: 50%;
          background: radial-gradient(closest-side, rgba(255, 90, 31, 0.22), rgba(255, 90, 31, 0));
        }
        #s1-floor {
          position: absolute;
          left: 108px;
          right: 108px;
          top: 880px;
          height: 3px;
          background: #f3eee5;
          opacity: 0.6;
          transform-origin: 50% 50%;
        }
        .s1-tick {
          position: absolute;
          top: 872px;
          width: 3px;
          height: 19px;
          background: #f3eee5;
          opacity: 0.45;
        }
        #s1-shadow {
          position: absolute;
          left: 0;
          top: 866px;
          width: 180px;
          height: 28px;
          margin-left: -90px;
          border-radius: 50%;
          background: rgba(0, 0, 0, 0.55);
        }
        .s1-ring {
          position: absolute;
          top: 855px;
          left: 0;
          width: 260px;
          height: 52px;
          margin-left: -130px;
          border: 3px solid #ff5a1f;
          border-radius: 50%;
          opacity: 0;
        }
        .s1-onion {
          position: absolute;
          left: 0;
          top: 0;
          width: 14px;
          height: 14px;
          margin: -7px 0 0 -7px;
          border-radius: 50%;
          background: #f3eee5;
          opacity: 0;
        }
        #s1-ball {
          position: absolute;
          left: 0;
          top: 0;
          width: 140px;
          height: 140px;
          margin: -140px 0 0 -70px;
          border-radius: 50%;
          background: #f3eee5;
          transform-origin: 50% 100%;
          will-change: transform;
        }
        #s1-title {
          position: absolute;
          left: 108px;
          top: 170px;
          width: 1100px;
        }
        #s1-kicker {
          display: block;
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.14em;
          color: #ff5a1f;
          margin-bottom: 18px;
        }
        #s1-heading {
          display: block;
          font-family: "Instrument Serif", serif;
          font-style: italic;
          font-size: 120px;
          line-height: 1;
          letter-spacing: -0.02em;
        }
        .s1-word {
          display: inline-block;
        }
        #s1-readout {
          position: absolute;
          right: 108px;
          top: 910px;
          font-family: "JetBrains Mono", monospace;
          font-size: 20px;
          letter-spacing: 0.08em;
          color: #9a9086;
          text-align: right;
          font-variant-numeric: tabular-nums;
        }
      </style>

      <div id="root" data-composition-id="s1-bounce" data-width="1920" data-height="1080">
        <div id="s1-glow"></div>
        <div id="s1-title">
          <span id="s1-kicker">PRINCIPLE 01 / 12</span>
          <span id="s1-heading"
            ><span class="s1-word">Squash</span> <span class="s1-word">&amp;</span>
            <span class="s1-word">stretch.</span></span
          >
        </div>
        <div id="s1-floor"></div>
        <div id="s1-ticks"></div>
        <div id="s1-onions"></div>
        <div class="s1-ring" id="s1-ring-0"></div>
        <div class="s1-ring" id="s1-ring-1"></div>
        <div class="s1-ring" id="s1-ring-2"></div>
        <div class="s1-ring" id="s1-ring-3"></div>
        <div class="s1-ring" id="s1-ring-4"></div>
        <div id="s1-shadow"></div>
        <div id="s1-ball"></div>
        <div id="s1-readout">IMPACT 00 · VY 0000 PX/S</div>
      </div>

      <script>
        (function () {
          const FLOOR = 880;
          const IMPACTS = [0.9375, 1.875, 2.578125, 3.046875, 3.28125];
          const APEX = [520, 292, 130, 32]; // h ∝ gap² — real projectile spacing
          const T0 = 0.18;
          const START_Y = -160;
          const WIPE_AT = 3.52;
          const END = 3.75;
          const X0 = 1500;
          const X1 = 1220;

          const root = document.querySelector('[data-composition-id="s1-bounce"]');
          const ball = root.querySelector("#s1-ball");
          const shadow = root.querySelector("#s1-shadow");
          const readout = root.querySelector("#s1-readout");

          // floor ticks (spacing ruler)
          const ticks = root.querySelector("#s1-ticks");
          for (let i = 0; i <= 28; i++) {
            const d = document.createElement("div");
            d.className = "s1-tick";
            d.style.left = 108 + i * 61 + "px";
            d.style.height = i % 4 === 0 ? "26px" : "14px";
            d.style.top = i % 4 === 0 ? "868px" : "875px";
            ticks.appendChild(d);
          }

          function xAt(t) {
            const k = Math.min(1, Math.max(0, (t - T0) / (IMPACTS[4] - T0)));
            return X0 + (X1 - X0) * (1 - Math.pow(1 - k, 2));
          }
          // analytic bounce: y = ball bottom
          function yAt(t) {
            if (t <= T0) return START_Y;
            if (t < IMPACTS[0]) {
              const u = (t - T0) / (IMPACTS[0] - T0);
              return START_Y + (FLOOR - START_Y) * u * u;
            }
            for (let i = 0; i < 4; i++) {
              const a = IMPACTS[i];
              const b = IMPACTS[i + 1];
              if (t < b) {
                const u = (t - a) / (b - a);
                return FLOOR - 4 * APEX[i] * u * (1 - u);
              }
            }
            return FLOOR;
          }
          function vAt(t) {
            const e = 1 / 240;
            return (yAt(t + e) - yAt(t - e)) / (2 * e);
          }

          // onion-skin spacing chart: a stamp every 1/15s
          const onions = [];
          const onionWrap = root.querySelector("#s1-onions");
          for (let ts = T0 + 0.1; ts < IMPACTS[4]; ts += 1 / 15) {
            const d = document.createElement("div");
            d.className = "s1-onion";
            d.style.left = xAt(ts) + "px";
            d.style.top = yAt(ts) - 70 + "px";
            onionWrap.appendChild(d);
            onions.push({ el: d, ts });
          }
          const rings = IMPACTS.map((_, i) => root.querySelector("#s1-ring-" + i));

          const lerp = (a, b, k) => a + (b - a) * k;
          const state = { t: 0 };

          function render() {
            const t = state.t;
            const x = xAt(t);
            let y = yAt(t);
            let sx = 1;
            let sy = 1;
            let scale = 1;

            // stretch along velocity
            const v = vAt(t);
            if (t > T0 && t < IMPACTS[4]) {
              const st = Math.min(0.42, Math.abs(v) / 5200);
              sy = 1 + st;
              sx = 1 / (1 + st * 0.8);
            }
            // squash on every impact: fast attack, springy recovery
            IMPACTS.forEach((ti, i) => {
              const dt = t - ti;
              if (dt >= 0 && dt < 0.22) {
                const amt = [0.5, 0.42, 0.34, 0.24, 0.3][i];
                const env = Math.exp(-dt / 0.035) * Math.cos(dt * 38);
                sy *= 1 - amt * env;
                sx *= 1 + amt * 1.1 * env;
              }
            });
            // anticipation: settle and squash flat, blush to signal
            if (t >= IMPACTS[4]) {
              const k = Math.min(1, (t - IMPACTS[4]) / (WIPE_AT - IMPACTS[4]));
              const e = 1 - Math.pow(1 - k, 3);
              sy = lerp(sy, 0.55, e);
              sx = lerp(sx, 1.55, e);
              ball.style.background = e > 0.5 ? "#ff5a1f" : "#f3eee5";
            } else {
              ball.style.background = "#f3eee5";
            }
            // circle wipe: pop and swell over the whole frame
            if (t >= WIPE_AT) {
              const k = Math.min(1, (t - WIPE_AT) / (END - WIPE_AT));
              const e = k * k * k;
              sy = lerp(0.55, 1, Math.min(1, k * 3));
              sx = lerp(1.55, 1, Math.min(1, k * 3));
              scale = lerp(1, 26, e);
              // origin is the ball's base — re-derive y so the swell stays centred on the ball
              const cy = lerp(FLOOR - 70 * 0.55, FLOOR - 160, Math.min(1, k * 2));
              y = cy + 70 * sy * scale;
            }
            ball.style.transform = `translate(${x}px, ${y}px) scale(${sx * scale}, ${sy * scale})`;

            // contact shadow shrinks with height
            const h = Math.max(0, FLOOR - y);
            const ss = Math.max(0.25, 1 - h / 700);
            shadow.style.transform = `translate(${x}px, 0) scale(${ss}, ${ss})`;
            shadow.style.opacity = t < T0 + 0.2 ? String(Math.max(0, (t - T0) / 0.2)) : t > WIPE_AT ? "0" : "1";

            // impact rings
            IMPACTS.forEach((ti, i) => {
              const dt = t - ti;
              const r = rings[i];
              if (dt < 0 || dt > 0.6) {
                r.style.opacity = "0";
                return;
              }
              const k = dt / 0.6;
              r.style.opacity = String((1 - k) * 0.9);
              r.style.transform = `translate(${xAt(ti)}px, 0) scale(${0.4 + 1.4 * (1 - Math.pow(1 - k, 3))})`;
            });

            // onion skins fade behind the ball
            onions.forEach((o) => {
              const dt = t - o.ts;
              o.el.style.opacity = dt < 0 || t > WIPE_AT ? "0" : String(0.55 * Math.exp(-dt / 0.9));
            });

            // animator's readout
            let n = 0;
            IMPACTS.forEach((ti, i) => {
              if (t >= ti) n = i + 1;
            });
            {
              const vy = Math.min(9999, Math.round(Math.abs(v)));
              readout.textContent = `IMPACT ${String(n).padStart(2, "0")} · VY ${String(vy).padStart(4, "0")} PX/S`;
            }
          }

          const tl = gsap.timeline({ paused: true });
          tl.fromTo(state, { t: 0 }, { t: END, duration: END, ease: "none", onUpdate: render }, 0);

          // set dressing
          tl.fromTo("#s1-floor", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "expo.out" }, 0.05);
          tl.fromTo("#s1-ticks", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.4);
          tl.fromTo("#s1-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.4, ease: "sine.out" }, 0.3);
          tl.to("#s1-glow", { scale: 1.12, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.7);
          tl.fromTo("#s1-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.35);
          tl.fromTo(
            "#s1-heading .s1-word",
            { opacity: 0, y: 70, rotation: 4 },
            { opacity: 1, y: 0, rotation: 0, duration: 0.7, ease: "expo.out", stagger: 0.09 },
            0.94,
          );
          tl.fromTo("#s1-readout", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.9);
          // everything but the ball clears for the wipe
          tl.to("#s1-title, #s1-readout, #s1-ticks", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 3.3);
          tl.to("#s1-floor", { scaleX: 0, duration: 0.3, ease: "power3.in" }, 3.3);
          tl.to("#s1-glow", { opacity: 0, duration: 0.3 }, 3.3);

          window.__timelines["s1-bounce"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
