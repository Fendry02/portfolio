<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0e0c0a;
          color: #f3eee5;
        }
        #s5-stage {
          position: absolute;
          inset: 0;
          perspective: 1400px;
          perspective-origin: 50% 40%;
        }
        #s5-plane {
          position: absolute;
          left: 0;
          top: 0;
          width: 1920px;
          height: 1080px;
          transform-origin: 50% 50%;
          transform-style: preserve-3d;
        }
        .s5-tile {
          position: absolute;
          width: 96px;
          height: 96px;
          background: #2a2520;
          will-change: transform;
        }
        #s5-caption {
          position: absolute;
          left: 108px;
          top: 150px;
          padding: 18px 26px;
          background: #0e0c0a;
          font-family: "JetBrains Mono", monospace;
          font-size: 22px;
          letter-spacing: 0.12em;
          color: #f3eee5;
        }
        #s5-caption b {
          color: #ff5a1f;
          font-weight: 700;
        }
      </style>

      <div id="root" data-composition-id="s5-grid" data-width="1920" data-height="1080">
        <div id="s5-stage">
          <div id="s5-plane"></div>
        </div>
        <div id="s5-caption">135 TILES · <b>1</b> TIMELINE · <span id="s5-cap-state">STAGGER.FROM = CENTER</span></div>
      </div>

      <script>
        (function () {
          const COLS = 15;
          const ROWS = 9;
          const P = 120;
          const CX = 7;
          const CY = 4;
          const root = document.querySelector('[data-composition-id="s5-grid"]');
          const plane = root.querySelector("#s5-plane");
          const capState = root.querySelector("#s5-cap-state");

          // 8-spoke burst on the grid, centred on the match-cut tile
          const inBurst = (c, r) => {
            const dx = c - CX;
            const dy = r - CY;
            if (dx === 0 && dy === 0) return true;
            if (dy === 0 && Math.abs(dx) <= 6) return true;
            if (dx === 0 && Math.abs(dy) <= 4) return true;
            if (Math.abs(dx) === Math.abs(dy) && Math.abs(dx) <= 4) return true;
            return false;
          };

          const tiles = [];
          for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
              const d = document.createElement("div");
              d.className = "s5-tile";
              d.style.left = 60 + c * P + 12 + "px";
              d.style.top = r * P + 12 + "px";
              plane.appendChild(d);
              tiles.push({ el: d, c, r, dist: Math.hypot(c - CX, r - CY), burst: inBurst(c, r) });
            }
          }
          const center = tiles.find((t) => t.c === CX && t.r === CY).el;
          center.style.background = "#ff5a1f";
          const others = tiles.filter((t) => t.el !== center);
          const byDist = (arr, amount, from = 0) =>
            arr.map((t) => ({ el: t.el, at: from + (t.dist / 8.1) * amount }));

          const tl = gsap.timeline({ paused: true });
          // caption state is a pure function of time (seek-safe, no callbacks)
          const CAPS = [
            [0, "STAGGER.FROM = CENTER"],
            [0.9375, "STAGGER.FROM = START · AXIS X"],
            [1.875, "BORDER-RADIUS · RIPPLE"],
            [2.34375, "MARK · 25 OF 135 TILES"],
          ];
          const capClock = { t: 0 };
          let capLast = "";
          tl.fromTo(
            capClock,
            { t: 0 },
            {
              t: 3.75,
              duration: 3.75,
              ease: "none",
              onUpdate: () => {
                let txt = CAPS[0][1];
                CAPS.forEach(([at, v]) => capClock.t >= at && (txt = v));
                if (txt !== capLast) capState.textContent = capLast = txt;
              },
            },
            0,
          );

          // centre tile arrives from s4 rotated a quarter turn — settle it with a spring
          tl.fromTo(center, { rotation: 90, scale: 1 }, { rotation: 180, scale: 1, duration: 0.5, ease: "back.out(3)" }, 0);

          // wave in from the centre: distance → delay (≤ 0.5s spread)
          byDist(others, 0.5, 0.06).forEach(({ el, at }) => {
            tl.fromTo(el, { scale: 0, rotation: -45 }, { scale: 1, rotation: 0, duration: 0.42, ease: "back.out(2.4)" }, at);
          });

          // beat 2 — rotation wave sweeps left → right
          tiles.forEach((t) => {
            tl.to(t.el, { rotation: t.el === center ? 270 : 90, duration: 0.4, ease: "back.inOut(2)" }, 0.9375 + t.c * 0.022);
          });

          // beat 4 — corners round off in a ripple from the centre
          byDist(tiles, 0.35, 1.875).forEach(({ el, at }) => {
            tl.fromTo(el, { borderRadius: "0%" }, { borderRadius: "50%", duration: 0.3, ease: "power2.inOut", immediateRender: false }, at);
          });

          // beat 5 — the burst mark lights up, the rest recedes
          byDist(tiles, 0.3, 2.34375).forEach(({ el, at }, i) => {
            const t = tiles[i];
            tl.to(
              el,
              {
                backgroundColor: t.burst ? "#ff5a1f" : "#1c1915",
                scale: t.burst ? 1.08 : 0.55,
                borderRadius: t.burst ? "50%" : "20%",
                duration: 0.28,
                ease: "power3.out",
              },
              at,
            );
          });

          // the mark spins a notch on the off-beat
          tl.fromTo("#s5-plane", { rotation: 0, scale: 1 }, { rotation: 0, scale: 1.06, duration: 0.9, ease: "sine.inOut" }, 2.34375);

          // exit — the plane tips back into a floor and the camera dives (hands off to s6's corridor)
          tl.to("#s5-plane", { rotationX: 72, y: 380, scale: 1.4, duration: 0.47, ease: "power3.in" }, 3.28);
          tl.to(".s5-tile", { opacity: 0, duration: 0.2, ease: "none" }, 3.55);
          tl.to("#s5-caption", { opacity: 0, y: -20, duration: 0.25, ease: "power2.in" }, 3.28);
          tl.fromTo("#s5-caption", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, 0.3);
          tl.set("#s5-caption", { opacity: 0 }, 0);

          window.__timelines["s5-grid"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
